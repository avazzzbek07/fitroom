<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FITROOM — виртуальная примерочная</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="#/">FIT<span>ROOM</span></a>
      <nav class="nav">
        <a href="#/catalog" data-nav="catalog" data-i18n="navCatalog"></a>
        <a href="#/try" data-nav="try" data-i18n="navTry"></a>
      </nav>
      <div class="header-right">
        <div class="lang">
          <button data-lang="ru">RU</button>
          <button data-lang="en">EN</button>
        </div>
        <a class="cart-btn" href="#/cart" data-nav="cart">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          <span data-i18n="navCart" class="cart-label"></span>
          <span id="cartCount" class="badge" hidden></span>
        </a>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <a class="logo" href="#/">FIT<span>ROOM</span></a>
      <p class="muted small" data-i18n="footer"></p>
    </div>
  </footer>

  <div id="toast" class="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
